!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <P> MI PRIMER PROYECTO </P>
    <center><h1>INICIO DE SESION CON PYTHON</h1></center>


 <form action="/add" method="POST">
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">INGRESE SU NOMBRE</label>
    <input type="text" class="form-control" name="name" placeholder="ingrese su nombre">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">CORREO ELECTRONICO</label>
    <input type="email" class="form-control" name="email" placeholder="Ingrese su correo electrónico">

  <button type="submit" class="btn btn-primary">REGISTRARSE</button>

</form>
<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Correo Electrónico</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for u in user %}
    <tr>
    <th scope="row">{{u[0]}}</th> 
      <td>{{u[1]}}</td>
      <td>{{u[2]}}</td>
      <td>
        <a href="/edit/{{u[0]}}" class="btn btn-outline-success">EDITAR</a>
        <a href="/delete/{{u[0]}}" class="btn btn-outline-danger">ELIMINAR</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</table>
</body>
</html>
